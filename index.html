<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#28333f;--text:#eef3f6;--muted:#93a1ad;--green:#9fef00}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 50% 35%,rgba(159,239,0,.07),transparent 35%)}
.grid{position:absolute;inset:-40%;background-image:linear-gradient(rgba(159,239,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(159,239,0,.035) 1px,transparent 1px);background-size:46px 46px;transform:perspective(500px) rotateX(60deg) translateY(20%);animation:grid 14s linear infinite}
@keyframes grid{to{background-position:0 46px,46px 0}}
.orbit{position:absolute;width:520px;height:520px;left:50%;top:50%;margin:-260px;border:1px solid rgba(159,239,0,.12);border-radius:50%;animation:spin 28s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(159,239,0,.08);border-radius:50%;inset:55px}.orbit:after{inset:125px}
@keyframes spin{to{transform:rotate(360deg)}}
.word{position:absolute;font:700 11px ui-monospace,monospace;letter-spacing:.18em;color:rgba(159,239,0,.19);animation:float var(--time) ease-in-out var(--delay) infinite alternate}
@keyframes float{to{transform:translate(20px,-32px);opacity:.75}}
.shell{position:relative;z-index:2;width:min(650px,calc(100% - 32px));padding:46px;text-align:center;border:1px solid var(--line);border-radius:16px;background:rgba(13,17,23,.84);backdrop-filter:blur(13px);box-shadow:0 28px 80px rgba(0,0,0,.35)}
.prompt{color:var(--green);font:700 12px ui-monospace,monospace;letter-spacing:.14em}
h1{font-size:clamp(36px,7vw,62px);letter-spacing:-.055em;line-height:1;margin:20px 0 14px}
p{color:var(--muted);line-height:1.65;margin:0 auto;max-width:470px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:34px}
.lang{position:relative;padding:19px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;color:var(--text);transition:.22s;overflow:hidden}
.lang strong{display:block;font-size:18px}.lang span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.lang:after{content:"→";position:absolute;right:15px;top:15px;color:#61707c;transition:.2s}
.lang:hover{transform:translateY(-4px);border-color:var(--green)}.lang:hover:after{color:var(--green);transform:translateX(3px)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;margin-left:5px;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media(max-width:560px){.shell{padding:34px 20px}.langs{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
